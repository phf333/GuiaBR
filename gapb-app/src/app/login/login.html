<div class="login-page">
  <div class="login-card">
    <h1 class="login-card__title">GuiaBR</h1>
    <p class="login-card__subtitle">Guia Alimentar para a População Brasileira</p>

    <form class="login-form" (ngSubmit)="onSubmit()" #form="ngForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" autocomplete="email"
          required />
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" type="password" [(ngModel)]="senha" name="senha" placeholder="••••••••"
          autocomplete="current-password" required />
      </div>

      <div class="form-error" *ngIf="erro">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><use href="/assets/icons.svg#alert-circle-solid" /></svg>
        {{ erro }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="carregando">
        <span *ngIf="!carregando">Entrar</span>
        <span *ngIf="carregando" class="spinner"></span>
      </button>
    </form>

    <p class="login-card__footer">
      Não tem uma conta? <a routerLink="/registro">Criar conta</a>
    </p>
  </div>
</div>
