server {
    listen 80;
    listen [::]:80;
    server_name localhost 192.168.1.233;

    # Se a requisição original NÃO for HTTPS (ou seja, se for acesso local direto via HTTP),
    # redireciona para a versão HTTPS local. Túneis como Ngrok enviam $http_x_forwarded_proto = "https".
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Pasta com o build de produção do Angular para quando acessado via túnel Ngrok
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 192.168.1.233;

    # Configuração dos certificados SSL autoassinados
    ssl_certificate /etc/nginx/certs/192.168.1.233.pem;
    ssl_certificate_key /etc/nginx/certs/192.168.1.233-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Pasta com o build de produção do Angular
    root /usr/share/nginx/html;
    index index.html;

    # Habilita roteamento do Angular Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o backend Flask
    location /api {
        proxy_pass http://backend:5000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

